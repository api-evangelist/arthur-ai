aid: arthur-ai
name: Arthur AI
description: >-
  Arthur is an enterprise AI governance and observability platform for discovering,
  monitoring, evaluating, and governing AI and ML systems in production. The Arthur
  Platform API (internally "Arthur Scope", OpenAPI 3.1) exposes 213 operations across
  models, tasks, datasets, connectors, metrics, alerts, alert rules, policies,
  workspaces, projects, agents, and webhooks, secured with OAuth2 via Keycloak. Arthur
  also ships the open-source Arthur Engine (LLM guardrails plus ML evaluation), the
  arthur-bench LLM evaluation library, Python client SDKs, and an Agent Toolkit with a
  Claude Code integration for end-to-end tracing.
